server:
  port: 9000

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://localhost:5432/users_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

jwt:
  secret: user-service-dev-secret-key-must-be-long-enough-256bits
  expiration-ms: 86400000
